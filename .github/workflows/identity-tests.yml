name: First party identity
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: identity_test
          POSTGRES_PASSWORD: identity_test_only
          POSTGRES_DB: identity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      IDENTITY_POSTGRES_TEST_URL: postgresql://identity_test:identity_test_only@localhost:5432/identity_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm run build && npm test -- --runInBand
        working-directory: backend
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
