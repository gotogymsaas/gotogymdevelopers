name: QAF Cyber SHADOW
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qaf-shadow
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'gotogymsaas/gotogymdevelopers'
    runs-on: ubuntu-latest
    environment: qaf-shadow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require reviewed operational scanner profile
        run: python3 .github/qaf/validate.py --operational
  emit:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.repository == 'gotogymsaas/gotogymdevelopers'
    permissions:
      contents: read
      id-token: write
    uses: gotogymsaas/cybersecurity/.github/workflows/qaf-emitter.yml@589aa20ffd70bede2394a4769b2aab60c4a5c68d
    with:
      project_id: gotogymdevelopers
      tooling_ref: 589aa20ffd70bede2394a4769b2aab60c4a5c68d
      scanner_profile: .github/qaf/scanner-profile.json
    secrets:
      QAF_TOOLING_READ_TOKEN: ${{ secrets.QAF_TOOLING_READ_TOKEN }}
