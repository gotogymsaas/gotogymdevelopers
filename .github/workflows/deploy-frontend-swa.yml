name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-swa.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GOTOGYM_DEVELOPERS || secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate SWA deployment token
        run: |
          if [ -z "$SWA_DEPLOY_TOKEN" ]; then
            echo "Missing Static Web Apps token. Define one of these secrets:" >&2
            echo "- AZURE_STATIC_WEB_APPS_API_TOKEN_GOTOGYM_DEVELOPERS" >&2
            echo "- AZURE_STATIC_WEB_APPS_API_TOKEN" >&2
            exit 1
          fi

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: frontend/dist
          config_file_location: frontend
          output_location: ''
          skip_app_build: true
